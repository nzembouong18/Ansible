---
# Exemples de récupération de secrets depuis un coffre EXTERNE (non exécutables sans infrastructure)
- name: Secrets externes
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: HashiCorp Vault (KV v2)
      ansible.builtin.set_fact:
        db_password: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=kv/data/app/db:password url=https://vault.example.com:8200 auth_method=approle role_id=' ~ lookup('ansible.builtin.env', 'VAULT_ROLE_ID') ~ ' secret_id=' ~ lookup('ansible.builtin.env', 'VAULT_SECRET_ID')) }}"
      no_log: true
      when: false

    - name: AWS Secrets Manager
      ansible.builtin.set_fact:
        api_key: "{{ lookup('amazon.aws.aws_secret', 'prod/app/api_key', region='eu-west-3') }}"
      no_log: true
      when: false

    - name: AWS SSM Parameter Store
      ansible.builtin.set_fact:
        param: "{{ lookup('amazon.aws.aws_ssm', '/prod/app/param', region='eu-west-3', decrypt=true) }}"
      no_log: true
      when: false

    - name: Azure Key Vault
      ansible.builtin.set_fact:
        secret: "{{ lookup('azure.azcollection.azure_keyvault_secret', 'db-password', vault_url='https://kv.vault.azure.net') }}"
      no_log: true
      when: false

    - name: SOPS (fichier chiffré dans Git par KMS/age)
      ansible.builtin.set_fact:
        decrypted: "{{ lookup('community.sops.sops', 'secrets.enc.yaml') | from_yaml }}"
      no_log: true
      when: false

    - name: Variable d'environnement injectée par la CI / AWX
      ansible.builtin.set_fact:
        token: "{{ lookup('ansible.builtin.env', 'DEPLOY_TOKEN', default=omit) }}"
      no_log: true
      when: false
