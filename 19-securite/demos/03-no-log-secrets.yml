---
# Comparer: ansible-playbook 03-no-log-secrets.yml -v   (observez ce qui fuite et ce qui est masqué)
- name: Fuites de secrets et no_log
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    db_password: "S3cr3t-Ne-Pas-Afficher"
  tasks:
    - name: MAUVAIS - le secret apparaît dans la sortie (-v) et dans les logs AWX  # noqa: no-log-password
      ansible.builtin.command: echo "mot de passe={{ db_password }}"
      changed_when: false
      register: fuite

    - name: BON - no_log masque arguments ET résultat
      ansible.builtin.command: echo "mot de passe={{ db_password }}"
      changed_when: false
      no_log: true
      register: protege

    - name: Utiliser le secret sans l'afficher
      ansible.builtin.copy:
        dest: /tmp/demo-secret.conf
        content: "password={{ db_password }}\n"
        mode: "0600"
      no_log: true

    - name: Boucle sans fuite grâce à loop_control.label (sinon chaque item est affiché)
      ansible.builtin.debug:
        msg: "traitement de l'utilisateur"
      loop:
        - { name: alice, password: "pwd-alice" }
        - { name: bob, password: "pwd-bob" }
      loop_control:
        label: "{{ item.name }}"      # le label évite d'afficher le mot de passe de l'item

    - name: Vérifier les droits du fichier secret
      ansible.builtin.stat:
        path: /tmp/demo-secret.conf
      register: st

    - name: Contrôle
      ansible.builtin.assert:
        that: st.stat.mode == '0600'
