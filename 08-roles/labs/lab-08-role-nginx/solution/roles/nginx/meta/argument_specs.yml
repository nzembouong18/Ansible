---
argument_specs:
  main:
    short_description: Installe et configure nginx
    options:
      nginx_port:
        type: int
        default: 80
        description: Port d'écoute du vhost.
      nginx_server_name:
        type: str
        default: "_"
        description: Valeur de server_name.
      nginx_root:
        type: path
        default: /var/www/html
        description: Racine web.
      nginx_index_content:
        type: str
        required: false
        description: Contenu HTML de index.html.
      nginx_worker_connections:
        type: int
        default: 1024
        description: Réservé (non utilisé par le vhost).
      nginx_extra_headers:
        type: dict
        default: {}
        description: En-têtes HTTP ajoutés (nom -> valeur).
      nginx_enabled:
        type: bool
        default: true
        description: Activer nginx au démarrage.
