---
- name: Lab 04 - nginx + page d'accueil
  hosts: webservers
  become: true

  tasks:
    - name: Mettre à jour le cache apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'
      tags: [install]

    - name: Installer nginx
      ansible.builtin.package:
        name: nginx
        state: present
      tags: [install]

    - name: Déployer la page d'accueil
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"
      tags: [config]

    - name: Masquer la version de nginx
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/server_tokens.conf
        content: |
          # Géré par Ansible
          server_tokens off;
        owner: root
        group: root
        mode: "0644"
      notify: Recharger nginx
      tags: [config]

    - name: Démarrer et activer nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags: [install]

    - name: Vérifier que le site répond
      ansible.builtin.uri:
        url: http://localhost/
        status_code: 200
        return_content: true
      register: reponse
      retries: 5
      delay: 2
      until: reponse.status == 200
      changed_when: false
      tags: [verify]

  handlers:
    - name: Recharger nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
