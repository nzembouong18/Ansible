# Configuration Ansible du labo (utilisée dans le conteneur "control")
[defaults]
inventory            = /workspace/00-lab/inventory/hosts.yml
remote_user          = ansible
private_key_file     = ~/.ssh/id_ed25519
host_key_checking    = False
roles_path           = ./roles
collections_path     = ~/.ansible/collections
retry_files_enabled  = False
stdout_callback      = default
# result_format=yaml remplace l'ancien callback 'yaml' (supprimé de community.general 12)
result_format        = yaml
callbacks_enabled    = ansible.builtin.timer, ansible.posix.profile_tasks
interpreter_python   = auto_silent
forks                = 10

[privilege_escalation]
become               = False
become_method        = sudo

[ssh_connection]
pipelining           = True
ssh_args             = -o ControlMaster=auto -o ControlPersist=60s
