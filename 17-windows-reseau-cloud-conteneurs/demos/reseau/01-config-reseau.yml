---
- name: Configuration d'équipements réseau Cisco IOS
  hosts: routeurs
  gather_facts: false
  tasks:
    - name: Collecter les facts réseau
      cisco.ios.ios_facts:
        gather_subset: min

    - name: Sauvegarder la configuration courante
      cisco.ios.ios_config:
        backup: true
        backup_options:
          dir_path: ./backups
          filename: "{{ inventory_hostname }}.cfg"

    - name: Bannière et NTP (modèle impératif, idempotent par comparaison)
      cisco.ios.ios_config:
        lines:
          - ntp server 192.168.56.1
          - logging host 192.168.56.2
        save_when: modified

    - name: Interface en "resource module" (modèle déclaratif, recommandé)
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet0/1
            description: "Lien vers cœur de réseau"
            enabled: true
        state: merged

    - name: Adressage IPv4 déclaratif
      cisco.ios.ios_l3_interfaces:
        config:
          - name: GigabitEthernet0/1
            ipv4:
              - address: 10.10.0.1/24
        state: merged

    - name: Vérifier la connectivité
      cisco.ios.ios_ping:
        dest: 10.10.0.2
        count: 3

    - name: Commande de contrôle
      cisco.ios.ios_command:
        commands: show ip interface brief
      register: interfaces

    - name: Afficher le résultat
      ansible.builtin.debug:
        var: interfaces.stdout_lines
