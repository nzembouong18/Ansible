---
- name: Socle Windows
  hosts: windows
  gather_facts: true
  tasks:
    - name: Tester la connexion
      ansible.windows.win_ping:

    - name: Installer des fonctionnalités Windows (IIS)
      ansible.windows.win_feature:
        name: [Web-Server, Web-Mgmt-Tools]
        state: present
        include_management_tools: true
      register: iis
      notify: Redémarrer si nécessaire

    - name: Créer un dossier
      ansible.windows.win_file:
        path: C:\app\logs
        state: directory

    - name: Déployer un fichier modèle (win_template)
      ansible.windows.win_template:
        src: web.config.j2
        dest: C:\inetpub\wwwroot\web.config

    - name: Installer des logiciels avec Chocolatey
      chocolatey.chocolatey.win_chocolatey:
        name: [git, 7zip, notepadplusplus]
        state: present

    - name: Service Windows
      ansible.windows.win_service:
        name: W3SVC
        start_mode: auto
        state: started

    - name: Clé de registre
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\MonEntreprise
        name: Environnement
        data: production
        type: string

    - name: Règle de pare-feu
      community.windows.win_firewall_rule:
        name: HTTP-80
        localport: 80
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true

    - name: Mises à jour Windows
      ansible.windows.win_updates:
        category_names: [SecurityUpdates, CriticalUpdates]
        reboot: true
      when: apply_updates | default(false) | bool

    - name: Commande PowerShell
      ansible.windows.win_shell: Get-Service W3SVC | Select-Object -ExpandProperty Status
      register: statut
      changed_when: false

  handlers:
    - name: Redémarrer si nécessaire
      ansible.windows.win_reboot:
      when: iis.reboot_required
