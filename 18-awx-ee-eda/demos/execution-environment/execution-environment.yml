---
# ansible-builder build --tag ee-formation:1.0 --container-runtime podman   (ou docker)
version: 3

images:
  base_image:
    name: quay.io/fedora/fedora:40          # ou registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9

dependencies:
  ansible_core:
    package_pip: ansible-core>=2.17,<2.19
  ansible_runner:
    package_pip: ansible-runner
  galaxy: requirements.yml                  # collections
  python: requirements.txt                  # dépendances Python
  system: bindep.txt                        # paquets système

additional_build_steps:
  prepend_base:
    - RUN dnf -y install python3-pip python3-devel gcc && dnf clean all
  append_final:
    - RUN ansible --version && ansible-galaxy collection list | head -20
options:
  package_manager_path: /usr/bin/dnf
