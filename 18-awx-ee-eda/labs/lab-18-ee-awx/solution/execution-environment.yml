---
version: 3
images:
  base_image:
    name: quay.io/fedora/fedora:40
dependencies:
  ansible_core:
    package_pip: ansible-core>=2.17
  ansible_runner:
    package_pip: ansible-runner
  galaxy:
    collections:
      - name: ansible.posix
      - name: community.general
      - name: kubernetes.core
  python:
    - jmespath
    - netaddr
    - kubernetes
  system:
    - rsync [platform:rpm]
additional_build_steps:
  prepend_base:
    - RUN dnf -y install python3-pip && dnf clean all
options:
  package_manager_path: /usr/bin/dnf
